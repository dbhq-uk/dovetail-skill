version: 2
updates:
  # GitHub Actions only. There is deliberately no pip ecosystem here: the exact
  # layer is Python standard library with no third-party packages at all, and
  # that is a published promise rather than an accident - it is what makes the
  # scan safe to gate a pull request on. Nothing to keep up to date is the
  # point, not an omission.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
